<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação de Pedido - Smart 4.0</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #1a1d20; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .card { background-color: #24282e; padding: 30px; border-radius: 10px; width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #007bff; border-bottom: 2px solid #3a3f47; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #3a3f47; background-color: #1a1d20; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="card">
    <h2>Fazer Pedido de Bloco</h2>
    <form id="formPedido">
        <div class="form-group">
            <label for="posicaoEstoque">Andar/Posição no Estoque:</label>
            <select id="posicaoEstoque">
                <option value="1">Andar 1 (Posição 1)</option>
                <option value="2">Andar 2 (Posição 2)</option>
                <option value="3">Andar 3 (Posição 3)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="corAndar1">Cor da Base:</label>
            <select id="corAndar1">
                <option value="1">Preta</option>
                <option value="2">Vermelha</option>
            </select>
        </div>

        <div class="form-group">
            <label for="andares">Quantidade de Andares:</label>
            <select id="andares">
                <option value="1">1 Andar</option>
                <option value="2">2 Andares</option>
                <option value="3">3 Andares</option>
            </select>
        </div>

        <button type="button" onclick="enviarPedido()">🚀 Enviar Pedido para Máquina</button>
    </form>
</div>

<script>
    function enviarPedido() {
        const posicaoEstoque = document.getElementById("posicaoEstoque").value;
        const corAndar1 = document.getElementById("corAndar1").value;
        const andares = document.getElementById("andares").value;

        const pedido = {
            productCode: "BLOCO1",
            code: "OP" + Math.floor(Math.random() * 1000),
            parameters: [
                { value: parseInt(posicaoEstoque) },
                { value: parseInt(corAndar1) },
                { value: 1 }, { value: 1 }, { value: 1 },
                { value: 0 }, { value: 0 }, { value: 0 },
                { value: parseInt(andares) },
                { value: 1 }
            ]
        };

        fetch("http://192.168.150.200:1880/api/pedido", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(pedido)
        })
        .then(res => alert("Pedido enviado com sucesso!"))
        .catch(err => {
            console.error(err);
            alert("Pedido simulado enviado localmente!");
        });
    }
</script>

</body>
</html>
